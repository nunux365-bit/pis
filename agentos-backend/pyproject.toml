[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos-backend"
version = "0.1.0"
description = "1mg AgentOS Backend — LangGraph agents, skills, integrations"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "1mg" }]
# Python pins aligned with clinical-intelligence-platform/backend/.venv (pip freeze) where the
# package exists there; agentOS-only deps pinned for compatibility with that stack.
# Security-patched versions (2026-09) take precedence over that alignment when a CVE fix exists.
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn[standard]==0.40.0",
    "gunicorn==23.0.0",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    # bcrypt 4.1+ removed __about__; passlib 1.7.4 still reads it → pin for clean startup/login.
    "bcrypt>=4.0.1,<4.1",
    "email-validator==2.2.0",
    "greenlet==3.3.0",
    "langgraph==1.2.11",
    "langchain==1.3.9",
    "langchain-core==1.4.9",
    "langchain-text-splitters==1.1.2",
    "langchain-openai==1.1.16",
    "langchain-anthropic==1.4.6",
    "apscheduler==3.11.2",
    "redis==5.2.1",
    "sqlalchemy==2.0.45",
    "alembic==1.15.2",
    "asyncpg==0.30.0",
    "asyncmy==0.2.10",
    "psycopg2-binary==2.9.10",
    "qdrant-client==1.18.0",
    "mlflow==3.16.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.14.2",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.32",
    "websockets==15.0.1",
    "pymupdf==1.26.7",
    "pdfplumber==0.11.9",
    "httpx==0.28.1",
    "google-api-python-client==2.159.0",
    "google-auth==2.37.0",
    "google-auth-oauthlib==1.2.1",
    "jsonschema==4.25.1",
    "openpyxl==3.1.5",
    "pandas>=2.2,<3",
    "python-calamine>=0.2,<1",
    "anthropic==0.125.0",
    "openai==2.54.0",
    "deepgram-sdk==7.0.0",
    "python-docx>=1.1.0",
    "aiokafka==0.12.0",
    "aiobotocore==2.21.1",
    "boto3==1.37.1",
    "presidio-analyzer>=2.2.354",
    "presidio-anonymizer==2.2.362",
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    # Transitive CVE pins (would otherwise resolve to vulnerable versions).
    "pillow==12.3.0",
    "urllib3==2.7.0",
    "click==8.3.3",
    "cryptography==50.0.0",
    "gitpython==3.1.62",
    "h2==4.4.1",
    "httplib2==0.32.0",
    "idna==3.15",
    "mako==1.3.12",
    "pygments==2.20.0",
    "pyasn1==0.6.4",
    "sqlparse==0.6.0",
    "pyarrow==23.0.1",
    "langgraph-checkpoint==4.2.0",
    "langgraph-sdk==0.4.4",
    "langsmith==0.8.18",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
# O2C: drive Excel for multi-site Summary recalc (macOS/Windows + Microsoft Excel)
o2c_excel = [
    "xlwings==0.33.11",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "jobs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
