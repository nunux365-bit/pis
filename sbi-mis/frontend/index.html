<html lang="en">
<head>

  <title>SBI MIS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body, #app { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif; }

    .chip-green { background: #d1fae5; color: #065f46; }
    .chip-red   { background: #fee2e2; color: #991b1b; }
    .drawer { transition: transform .2s ease; }
    .col-h-click { cursor: pointer; }
    .col-h-click:hover { background: #eef2ff; }
    .sticky-col { position: sticky; left: 0; background: white; z-index: 1; }
  </style>
